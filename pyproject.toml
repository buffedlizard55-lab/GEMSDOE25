[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gems25"
version = "0.3.0"
description = "Designed-factorial fault discovery experiments for the DOE GEMS Prize (DrivenData #306)"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "rasterio", "scikit-learn", "pandas", "requests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 140
extend-exclude = ["data", "docs", "evidence"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
